name: Portfolio build

# 트리거 경로에 생성물(works/, media/, works.json, 루트 html)이 없으므로
# 이 워크플로가 만든 커밋으로 자신이 다시 돌지 않는다.
on:
  push:
    branches: [main]
    paths:
      - 'upload/**'
      - 'templates/**'
      - 'assets/**'
      - 'site.config.json'
      - 'tools/**'
      - '.github/workflows/portfolio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # 게시물 정렬이 폴더 추가 커밋 시각을 읽으므로 전체 이력이 필요하다
          fetch-depth: 0
          # 원본 이미지는 Git LFS에 있다. 이것이 없으면 러너가 실제 파일이
          # 아니라 LFS 포인터(텍스트)만 받아서 Pillow가 이미지를 열지 못한다.
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet "pillow==12.*" "pytest==9.*"

      - name: 테스트
        run: python -m pytest tools/tests -q

      - name: 빌드
        run: python tools/build.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in works media works.json index.html contact.html; do
            if [ -e "$path" ]; then
              git add -A -- "$path"
            fi
          done
          # 내용은 그대로인데 mtime만 바뀐 파일이 "변경됨"으로 잡히는 것을 막는다.
          # 빌드가 이미지 전부를 다시 인코딩하므로 이 상황이 실제로 생긴다.
          git update-index --refresh || true
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "chore(portfolio): 작업물 목록 자동 갱신"
          # 스테이징 목록에 없는 파일이 바뀌어 있으면 rebase가 거부한다.
          # 무엇이 남았는지 찍어두어 실패했을 때 원인을 바로 알 수 있게 한다.
          echo "--- 커밋 후 남은 변경 ---"
          git status --porcelain
          echo "-------------------------"
          # 같은 시간대에 올린 다른 업로드가 먼저 커밋을 밀어넣었을 수 있으므로,
          # 푸시 전에 최신 main 위로 다시 얹는다. 산출물은 upload/ 의 순수
          # 함수이므로 리베이스해도 안전하다. --autostash 는 위에서 찍은 잔여
          # 변경이 rebase를 막지 못하게 한다 — 그 변경은 빌드 부산물이라
          # 다음 실행에서 다시 만들어진다.
          git fetch origin main
          git rebase --autostash origin/main
          git push
