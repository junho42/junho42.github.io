# GitHub Pages 가 배포 산출물에서 뺄 것들.
#
# 이 사이트는 Jekyll 사이트가 아니다 — front matter 도 Liquid 도 쓰지 않으므로
# Jekyll 은 파일을 바이트 그대로 복사만 한다. 이 파일은 그 복사 대상에서
# 아래 항목을 빼기 위해서만 존재한다.
#
# upload/ 를 빼는 것이 핵심이다. 작가가 올리는 원본은 한 장에 수십 MB가 될 수
# 있고 웹에 공개할 이유가 없다. 사이트가 쓰는 것은 media/ 의 리사이즈 사본이다.
exclude:
  - upload/
  - templates/
  - tools/
  - docs/
  - README.md
  # 작업물 폴더에 복사해 쓰는 Info.json 빈 양식과 로컬 미리보기용 실행 파일,
  # 빌드가 HTML에 넣는 페이지 제목·연락처 원본
  - Info.json
  - localhost.bat
  - define.json
